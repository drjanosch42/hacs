name = "GL2"
defaultTargets = ["GL2", "AnthropicFLT"]

# Dependencies live in ONE shared tree, $LEAN_DEPS (default ${XDG_DATA_HOME:-~/.local/share}/hacs/lean-deps/),
# reached through the git-ignored symlink lean/.lake/packages (tools/lean_link_deps.sh).
# Never a per-worktree mathlib.

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "GL2"

# Slot 21 L21-V: 25 modules vendored byte-identical from anthropics/fermats-last-theorem @ 6e837e75
# (Apache-2.0; Vendor/AnthropicFLT/{LICENSE,NOTICE,ATTRIBUTION.md,MANIFEST.tsv,PROVENANCE.md}).
[[lean_lib]]
name = "AnthropicFLT"
srcDir = "Vendor/AnthropicFLT"
globs = ["Definitions.+", "P2M.+", "Theorems.+"]
leanOptions = { maxHeartbeats = 4000000, synthInstance.maxHeartbeats = 400000, backward.isDefEq.respectTransparency.types = false }

# Slot 22 LV-0: the kernel benchmarks of GL2.L23.RankF2 (generated by tools/gen_rankf2_bench.py).
# NOT a default target: `lake build L23Bench` or `lake env lean bench/L23/<file>` only.
[[lean_lib]]
name = "L23Bench"
srcDir = "bench"
globs = ["L23.+"]

# Slot 22 LV-1: the large F_2 cells of GL2.L23.TreeF2 (n = 400 ... 1000; generated by tools/gen_lv1_cells.py).
# NOT a default target (kernel time ~ minutes): `lake build L23Cells` only; the census and the replay do not see it.
[[lean_lib]]
name = "L23Cells"
srcDir = "cells"
globs = ["L23.+"]
